    <!-- RSVP -->
    <div class="rsvp-container">
      <div class="rsvp-card">
        <div class="rsvp-header">
          <h2>RSVP</h2>
          <p>
            Having loving Family and friends in our lives is the best gift of
            all. We look forward to celebrating with you kindly RSVP.
          </p>
        </div>

        <!-- form -->
        <form
          id="modern-rsvp"
          action="https://formspree.io/f/mreonjvl"
          method="POST">
          <div class="input-group">
            <label for="full-name">Your Name</label>
            <input
              type="text"
              id="full-name"
              name="Full Name"
              placeholder="Full Name"
              required />
          </div>

          <div class="radio-group">
            <label class="radio-container">
              <input type="radio" name="Attendance" value="Attending" checked />
              <span class="checkmark"></span>
              I am attending
            </label>
            <label class="radio-container">
              <input type="radio" name="Attendance" value="Declined" />
              <span class="checkmark"></span>
              I can't attend
            </label>
          </div>

          <div class="input-group">
            <label for="phone">Contact Number</label>
            <input
              type="tel"
              id="phone"
              name="Phone Number"
              placeholder="🇳🇬 +234 843 123 4067" />
          </div>

          <div class="input-group">
            <label for="message">Write a Message</label>
            <textarea
              id="message"
              name="Message"
              rows="4"
              placeholder="Your message or song requests..."></textarea>
          </div>

          <button type="submit" class="submit-btn">Send RSVP</button>
        </form>
      </div>
    </div>
